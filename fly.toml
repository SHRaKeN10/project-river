# fly.toml app configuration file generated for project-river-nick on 2026-09-03T15:33:39-05:00
#
# ONE MACHINE ONLY. The API holds every live table's state in memory (one
# single-writer actor per table). Never `fly scale count` past 1 and never
# turn on auto_stop/start - a restart or a second instance drops live hands.
# Redis is socket fan-out + restart-recovery snapshots, not horizontal scale.
# Full deploy walkthrough: docs/phase-9-deploy-steps.md · runbook: docs/ops-runbook.md

app = 'project-river-nick'
primary_region = 'dfw'

[build]
  dockerfile = 'docker/api.Dockerfile'

[deploy]
  strategy = 'immediate'
  release_command = 'node_modules/.bin/prisma migrate deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '4s'
    grace_period = '10s'
    method = 'get'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
